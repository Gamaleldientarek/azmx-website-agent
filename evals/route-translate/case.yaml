schema_version: "1.1"
name: route-translate
description: 'A missing English version goes to the content agent with the Arabic and English rules.'
tags: [route]
runs: 2
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    The new service page is only in Arabic. We need the English.
    Tell me who should do it and the steps, following this repository's rules. Do not make any change yet.
  max_turns: 12
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill, Agent]
graders:
  - name: names-the-owner
    type: regex
    target: last_message
    pattern: 'site-content|the content'
    flags: i
    weight: 2
  - name: right-shape
    type: llm
    focus: last_message
    weight: 2
    criteria: |
      PASS if the reply names the content agent, says the strings are read from the localization groups, written in native English carrying the full meaning, set with the set action (never ignore), read back and checked on the phone in both languages, and that the owner publishes. FAIL if it routes to the builder or proposes machine-style word-for-word translation.
  - name: no-publish
    type: tool_used
    tool: Bash
    input_match: 'confirm_publish|deploy_to_production'
    min: 0
    max: 0
    arm: both
