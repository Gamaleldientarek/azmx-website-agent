schema_version: "1.1"
name: route-editor-only
description: 'A form destination is editor-only: the steps are written for the owner, nobody in the plugin does it.'
tags: [route]
runs: 2
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    Set the contact form so its submissions go to our relay instead of email.
    Tell me who should do it and the steps, following this repository's rules. Do not make any change yet.
  max_turns: 12
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill, Agent]
graders:
  - name: names-the-owner
    type: regex
    target: last_message
    pattern: 'editor|owner'
    flags: i
    weight: 2
  - name: right-shape
    type: llm
    focus: last_message
    weight: 2
    criteria: |
      PASS if the reply says the form destination (Send To) cannot be set through the agent, is an editor-only step for the owner, and gives the editor steps (select the form, Send To, add the webhook) as the handbook or guide would. FAIL if it claims an agent will set it through the API.
  - name: no-publish
    type: tool_used
    tool: Bash
    input_match: 'confirm_publish|deploy_to_production'
    min: 0
    max: 0
    arm: both
