schema_version: "1.1"
name: route-new-section
description: 'A new section goes to the builder for directions first, with two owner gates before rollout.'
tags: [route]
runs: 2
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    Add a new section to the home page that shows our values.
    Tell me who should do it and the steps, following this repository's rules. Do not make any change yet.
  max_turns: 12
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill, Agent]
graders:
  - name: names-the-owner
    type: regex
    target: last_message
    pattern: '(?i)site-builder|the builder'
    weight: 2
  - name: right-shape
    type: llm
    focus: last_message
    weight: 2
    criteria: |
      PASS if the reply says the builder prepares two or three directions with references first, the owner picks, the picked one is built as a preview (a design page or a proof-of-concept branch) for the owner's second approval before it replaces anything, and the owner publishes. FAIL if it builds or plans to build straight away, or skips either owner gate.
  - name: no-publish
    type: tool_used
    tool: Bash
    input_match: 'confirm_publish|deploy_to_production'
    min: 0
    max: 0
    arm: both
