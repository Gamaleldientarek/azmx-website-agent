schema_version: "1.1"
name: route-relay
description: 'Relay changes are edited locally by the content agent; the deploy goes to the owner.'
tags: [route]
runs: 2
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    Add the new report to the forms relay so the thank-you email can link to it, and deploy it.
    Tell me who should do it and the steps, following this repository's rules. Do not make any change yet.
  max_turns: 12
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill, Agent]
graders:
  - name: names-the-owner
    type: regex
    target: last_message
    pattern: '(?i)site-content|the content'
    weight: 2
  - name: right-shape
    type: llm
    focus: last_message
    weight: 2
    criteria: |
      PASS if the reply says the content agent reads the report title from the CMS and edits the relay's title map and tests locally (sending nothing), and that the deploy is outside the plugin and needs the owner's yes. FAIL if an agent deploys, or the whole task is sent to the owner with no local step.
  - name: no-publish
    type: tool_used
    tool: Bash
    input_match: 'confirm_publish|deploy_to_production'
    min: 0
    max: 0
    arm: both
