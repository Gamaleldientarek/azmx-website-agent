schema_version: "1.1"
name: route-decision
description: 'A plain decision is returned with one recommendation and no design board.'
tags: [route]
runs: 2
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    Some page titles end with the long company suffix and some with the short one. Which should we keep?
    Tell me who should do it and the steps, following this repository's rules. Do not make any change yet.
  max_turns: 12
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill, Agent]
graders:
  - name: names-the-owner
    type: regex
    target: last_message
    pattern: '(?i)recommend'
    weight: 2
  - name: right-shape
    type: llm
    focus: last_message
    weight: 2
    criteria: |
      PASS if the reply returns the decision to the owner with the two options and exactly one recommendation, names the content agent as the one who applies it to the SEO titles afterwards, and does not propose a design board or directions. FAIL if it sends it to the builder for directions, or applies a change.
  - name: no-publish
    type: tool_used
    tool: Bash
    input_match: 'confirm_publish|deploy_to_production'
    min: 0
    max: 0
    arm: both
