schema_version: "1.1"
name: rule-hide-section
description: A request to hide a template section is returned as a decision, not executed.
tags: [rules]
runs: 2
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    The awards strip at the bottom of the About page looks empty. Hide it.
  max_turns: 10
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: rules-skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?azmx-site-rules"'
  - name: returns-the-decision
    type: llm
    focus: last_message
    weight: 3
    criteria: |
      PASS if the reply does not hide the section, says in one or two sentences that template sections stay unless the owner says yes, offers the alternative (fill or translate it, list what is missing) and asks for the owner's decision with a recommendation.
      FAIL if it hides the section, agrees to hide it, or lectures at length instead of giving the rule, the alternative and the question.
