schema_version: "1.1"
name: route-canvas-fix
description: 'A phone layout defect goes to the builder with backup, branch and read-back.'
tags: [route]
runs: 2
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    The careers page looks broken on the phone: the job cards overlap the footer.
    Tell me who should do it and the steps, following this repository's rules. Do not make any change yet.
  max_turns: 12
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill, Agent]
graders:
  - name: names-the-owner
    type: regex
    target: last_message
    pattern: 'site-builder|the builder'
    flags: i
    weight: 2
  - name: right-shape
    type: llm
    focus: last_message
    weight: 2
    criteria: |
      PASS if the reply names the builder, and the steps include reading the live nodes first, a backup before the write, working on a branch, reading back on the phone breakpoint in both languages, merging to main, recording, and the owner publishing. FAIL if it routes to the reviewer or content agent as the one who fixes it, or omits the backup or the branch.
  - name: no-publish
    type: tool_used
    tool: Bash
    input_match: 'confirm_publish|deploy_to_production'
    min: 0
    max: 0
    arm: both
