schema_version: "1.1"
name: route-record
description: 'Rewriting the task list before a publish goes to the scribe.'
tags: [route]
runs: 2
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    We are ready to publish. Rewrite the Right now block in the task list so the owner can read one paragraph before publishing.
    Tell me who should do it and the steps, following this repository's rules. Do not make any change yet.
  max_turns: 12
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill, Agent]
graders:
  - name: names-the-owner
    type: regex
    target: last_message
    pattern: 'site-scribe|the scribe'
    flags: i
    weight: 2
  - name: right-shape
    type: llm
    focus: last_message
    weight: 2
    criteria: |
      PASS if the reply names the scribe, says the block lists what goes live by page, what was checked, what the owner decided in the editor and what to look at before publishing, and that safe to publish is written only when the batch is complete. FAIL if it says the agent will publish or routes to the builder.
  - name: no-publish
    type: tool_used
    tool: Bash
    input_match: 'confirm_publish|deploy_to_production'
    min: 0
    max: 0
    arm: both
