schema_version: "1.1"
name: arabic-term
description: Arabic copy for the site uses «المنصة», never «البوابة», and does not mix languages in a sentence.
tags: [arabic]
runs: 2
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    Write the Arabic for this button label and its helper sentence on the website: "Open the portal" and "Sign in to the portal to see your reports." Follow the site's Arabic rules.
  max_turns: 8
  timeout_seconds: 240
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: uses-al-minassa
    type: regex
    target: last_message
    pattern: 'المنصة'
    weight: 2
  - name: never-al-bawaba
    type: regex
    target: last_message
    pattern: 'البوابة'
    match: not_contains
    weight: 2
    arm: both
  - name: reads-as-arabic
    type: llm
    focus: last_message
    criteria: |
      PASS if the Arabic is native Modern Standard Arabic that carries the full meaning of the English, and no sentence mixes Arabic and English words.
      FAIL if a sentence mixes the two languages, or the Arabic reads as word-for-word translated English.
